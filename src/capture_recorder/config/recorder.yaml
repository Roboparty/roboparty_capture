/**:
  ros__parameters:
    # Topic lists: config/presets/*.yaml; launch defaults to preset:=all.
    # To set topics in this file, launch with preset:=custom.
    output_dir: recordings/raw
    # Short session directory label; start request may override it. Chinese is supported.
    task: "未命名"
    # Native rosbag2 double buffer; memory may reach twice this value plus overhead.
    max_cache_size: 67108864
    max_bag_size: 0
    max_bag_duration: 0
    start_timeout: 15.0
    stop_timeout: 30.0
    qos_overrides_file: ""
    metadata_file: ""
    # storage_config_file defaults to the installed config/mcap.yaml.
